<form class="project-form" #projectForm="ngForm" (ngSubmit)="save(projectForm)">
  <div class="field">
    <label [for]="uid + '-name'">
      @if (project()) {
        <ng-container i18n>Name</ng-container>
      } @else {
        <ng-container i18n>New project</ng-container>
      }
    </label>
    <input
      [id]="uid + '-name'"
      name="name"
      [(ngModel)]="name"
      required
      minlength="2"
      maxlength="40"
      autocomplete="off"
      #nameCtrl="ngModel"
    />
  </div>

  <div class="field">
    <label [for]="uid + '-color'" i18n>Color</label>
    <input [id]="uid + '-color'" name="color" type="color" [(ngModel)]="color" />
  </div>

  <button type="submit" [disabled]="projectForm.invalid">
    @if (project()) {
      <ng-container i18n>Save</ng-container>
    } @else {
      <ng-container i18n>Add</ng-container>
    }
  </button>
  @if (project()) {
    <button type="button" class="secondary" (click)="cancelled.emit()" i18n>Cancel</button>
  }

  @if (nameCtrl.invalid && nameCtrl.touched) {
    <p class="error" role="alert" i18n>The name needs 2 to 40 characters.</p>
  }
</form>
