<form class="add-task" (submit)="$event.preventDefault(); add()">
  <label for="new-task-title" class="visually-hidden" i18n>New task</label>
  <input
    id="new-task-title"
    #titleInput
    appAutofocus
    placeholder="What needs to be done?"
    i18n-placeholder
    autocomplete="off"
  />
  <button type="submit" i18n>Add</button>
</form>
