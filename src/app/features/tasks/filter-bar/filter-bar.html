<div class="filter-bar" role="group" aria-label="Filter by status">
  @for (option of options; track option.value) {
    <button
      type="button"
      [class.active]="status() === option.value"
      [attr.aria-pressed]="status() === option.value"
      (click)="status.set(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
