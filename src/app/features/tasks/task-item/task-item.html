@let t = task();
<article class="task" [class.done]="t.done" [appHighlightOverdue]="t.dueDate" [done]="t.done">
  <input
    type="checkbox"
    [checked]="t.done"
    [attr.aria-label]="'Done: ' + t.title"
    (change)="toggleDone.emit(t.id)"
  />

  <a class="title" [routerLink]="['/tasks', t.id]">{{ t.title }}</a>

  @if (project(); as p) {
    <span class="project"><span class="dot" [style.background]="p.color"></span>{{ p.name }}</span>
  }

  <span class="badge" [class]="t.priority">{{ t.priority | priorityLabel }}</span>

  @if (t.dueDate) {
    <time
      class="due"
      [attr.datetime]="t.dueDate"
      [title]="t.dueDate | date: 'fullDate' : 'UTC' | titlecase"
    >
      {{ t.dueDate | relativeDate }}
    </time>
  } @else {
    <span class="due none">No due date</span>
  }

  <button
    type="button"
    class="icon"
    [attr.aria-label]="'Delete ' + t.title"
    (click)="remove.emit(t.id)"
  >
    ✕
  </button>
</article>
